server {
        server_name             community.tlaic.ac.cn;
        listen                  80;
        client_max_body_size    5000m;

        # API 反代到后端容器。10100 是本工程约定的后端端口
        # （portal 用 10088，两者互不影响）。
        location /v1 {
                proxy_pass http://devcom-backend:10100;

                proxy_connect_timeout 60s;
                proxy_read_timeout 1200s;
                proxy_send_timeout 1200s;
                # 不缓冲整个请求体，边收边转发：资源文件动辄上百 MB，
                # 缓冲会把它们先全部写进 nginx 临时目录再转发。
                proxy_request_buffering off;

                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 本地存储模式（CACHE_MODE=local）下，后端把图片/文档挂在
        # /static 的四个子路径上：/static/video /audio /image /docs。
        location /static {
                proxy_pass http://devcom-backend:10100;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
        }

        root /usr/share/nginx/html;
        location ~* ^.+\.(css|js|txt|xml|swf|wav)$ {
                access_log off;
                expires 24h;
        }

        # SPA 回退：前端是 BrowserRouter，深链接（/news/xxx）必须回落 index.html
        location / {
                index index.html index.htm;
                try_files $uri $uri/ /index.html;
        }
}

server {
        server_name             community.tlaic.ac.cn;
        listen                  443 ssl;
        ssl_certificate         /etc/ssl/community.tlaic.ac.cn.pem;
        ssl_certificate_key     /etc/ssl/community.tlaic.ac.cn.key;
        ssl_protocols           TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;
        ssl_ciphers             HIGH:!aNULL:!MD5;
        client_max_body_size 5000m;

        location /v1 {
                proxy_pass http://devcom-backend:10100;

                proxy_connect_timeout 60s;
                proxy_read_timeout 1200s;
                proxy_send_timeout 1200s;
                proxy_request_buffering off;

                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /static {
                proxy_pass http://devcom-backend:10100;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
        }

        root /usr/share/nginx/html;
        location ~* ^.+\.(css|js|txt|xml|swf|wav)$ {
                access_log off;
                expires 24h;
        }

        location / {
                index index.html index.htm;
                try_files $uri $uri/ /index.html;
        }
}
